name: UDP CI

on:
  workflow_call:
  pull_request:
  push:
    branches: [main, "agent/**"]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        module: [checker, panel]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.3"
          cache-dependency-path: ${{ matrix.module == 'checker' && 'go.sum' || 'statuspage/go.sum' }}
      - name: Select module
        id: module
        run: echo "dir=${{ matrix.module == 'checker' && '.' || 'statuspage' }}" >> "$GITHUB_OUTPUT"
      - name: gofmt
        working-directory: ${{ steps.module.outputs.dir }}
        run: test -z "$(gofmt -l .)"
      - name: Vet
        working-directory: ${{ steps.module.outputs.dir }}
        run: go vet ./...
      - name: Tests
        working-directory: ${{ steps.module.outputs.dir }}
        run: go test ./...
      - name: Race tests
        working-directory: ${{ steps.module.outputs.dir }}
        run: go test -race ./...

  real-xray-udp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.3"
      - name: Real xray-core SOCKS5 UDP E2E
        run: go test -count=1 -v ./udpmon -run '^TestRealXrayUDPAssociationMultipleReceivers$'

  docker:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: checker
            context: .
            file: ./Dockerfile
          - name: panel
            context: ./statuspage
            file: ./statuspage/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: false

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2

  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@0.32.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
