name: UDP CI

on:
  workflow_call:
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  compose:
    runs-on: ubuntu-latest
    env:
      PANEL_CHECKER_INTERNAL_TOKEN: ci-internal-token
      PANEL_ADMIN_TOKEN: ci-admin-token
      INTERNAL_PORT: "18081"
    steps:
      - uses: actions/checkout@v4
      - name: Validate prebuilt-image Compose
        run: docker compose config --quiet
      - name: Validate configurable internal port wiring
        run: |
          docker compose config --format json > /tmp/compose.json
          test "$(jq -r '.services.panel.environment.INTERNAL_PORT' /tmp/compose.json)" = "18081"
          test "$(jq -r '.services.checker.environment.SUBSCRIPTION_URL' /tmp/compose.json)" = "http://127.0.0.1:18081/sub"
          test "$(jq -r '.services.checker.environment.UDP_PANEL_URL' /tmp/compose.json)" = "http://127.0.0.1:18081"
      - name: Validate source-build Compose
        run: docker compose -f docker-compose.yml -f docker-compose.build.yml config --quiet
      - name: Validate standalone Panel Compose example
        run: docker compose -f statuspage/docker-compose.example.yml config --quiet
      - name: Validate source installer
        run: bash -n scripts/install-from-source.sh

  test:
    strategy:
      fail-fast: false
      matrix:
        module: [checker, panel]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.3"
          cache-dependency-path: ${{ matrix.module == 'checker' && 'go.sum' || 'statuspage/go.sum' }}
      - name: Select module
        id: module
        run: echo "dir=${{ matrix.module == 'checker' && '.' || 'statuspage' }}" >> "$GITHUB_OUTPUT"
      - name: gofmt
        working-directory: ${{ steps.module.outputs.dir }}
        run: test -z "$(gofmt -l .)"
      - name: Vet
        working-directory: ${{ steps.module.outputs.dir }}
        run: go vet ./...
      - name: Tests
        working-directory: ${{ steps.module.outputs.dir }}
        run: go test ./...
      - name: Race tests
        working-directory: ${{ steps.module.outputs.dir }}
        run: go test -race ./...

  real-xray-udp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.3"
      - name: Real xray-core SOCKS5 UDP E2E
        run: go test -count=1 -v ./udpmon -run '^TestRealXrayUDPAssociationMultipleReceivers$'

  docker:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: checker
            context: .
            file: ./Dockerfile
          - name: panel
            context: ./statuspage
            file: ./statuspage/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha,scope=build-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=build-${{ matrix.name }}

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
